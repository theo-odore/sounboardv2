<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soundboard</title>
    <!-- Use Inter font for a clean, modern look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <header class="app-header">
        <h1 class="title">Soundboard</h1>
        <p class="subtitle">Play meme sounds instantly or upload your own.</p>
        <div class="divider"></div>
    </header>

    <main class="content-area">
        <!-- Grid for sound buttons -->
        <section id="soundboard-grid" class="soundboard-grid">
            <!-- Dynamically populated or static initial sounds -->
        </section>

        <!-- Upload section -->
        <section class="upload-section">
            <h2>Upload Your Sound</h2>
            <div id="drop-zone" class="drop-zone">
                <p>Drag & drop audio/video file here, or click to select</p>
                <span class="supported-formats">Audio: .mp3, .wav, .ogg, .m4a | Video: .mp4, .mov, .mkv, .webm</span>
                <input type="file" id="file-input" accept="audio/*,video/*" hidden>
            </div>

            <div id="loading-indicator" class="loading-indicator hidden">
                <div class="spinner"></div>
                <p>Adding sound...</p>
            </div>
        </section>
    </main>

    <!-- Upload Details Modal -->
    <div id="upload-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Sound Details</h2>
            <div class="input-group">
                <label for="sound-title">Sound Name</label>
                <input type="text" id="sound-title" placeholder="e.g. Vine Boom" autocomplete="off" />
            </div>
            
            <div class="trim-controls">
                <p class="trim-label">Trim Audio (Optional)</p>
                <div class="time-inputs">
                    <div class="input-group">
                        <label for="start-time">Start Time (sec)</label>
                        <input type="number" id="start-time" min="0" step="0.1" placeholder="0.0">
                    </div>
                    <div class="input-group">
                        <label for="end-time">End Time (sec)</label>
                        <input type="number" id="end-time" min="0" step="0.1" placeholder="Max">
                    </div>
                </div>
            </div>

            <div class="modal-actions">
                <button id="cancel-upload" class="btn-cancel">Cancel</button>
                <button id="confirm-upload" class="btn-confirm">Upload Sound</button>
            </div>
        </div>
    </div>

    <!-- Template for a sound button item -->
    <template id="sound-item-template">
        <div class="sound-item">
            <button class="sound-button">
                <span class="button-inner"></span>
            </button>
            <h3 class="sound-name"></h3>
            <div class="sound-actions">
                <button class="action-btn delete-btn" title="Delete">🗑️</button>
            </div>
        </div>
    </template>

    <script src="script.js" type="module"></script>
</body>

</html>
