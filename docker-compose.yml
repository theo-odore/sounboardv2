services:
  soundboard:
    build: .
    container_name: soundboard
    restart: unless-stopped
    ports:
      - "3005:3000"
    environment:
      - PORT=3000
      - ADMIN_KEY=${ADMIN_KEY:-admin123}
    volumes:
      # Mount audio files and database so they persist permanently on host disk
      - ./uploads:/app/uploads
      - ./data:/app/data

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: soundboard-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://soundboard:3000
    depends_on:
      - soundboard
