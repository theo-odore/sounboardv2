services:
  soundboard:
    build: .
    container_name: soundboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - ADMIN_KEY=${ADMIN_KEY:-admin123}
    volumes:
      # Mount audio files and database so they persist permanently on host disk
      - ./uploads:/app/uploads
      - ./data:/app/data
